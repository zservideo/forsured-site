name: Update visual baselines

# Run this after an intended design change, in either of two ways:
#   - add the "update-baselines" label to the pull request, or
#   - run it from the Actions tab on the branch.
# It re-takes every screenshot in tests/visual.spec.js in the same Playwright image CI uses,
# commits the new images to that branch (the pull request diff shows them for review),
# then starts the "Site tests" workflow again on the branch.
on:
  workflow_dispatch:
  pull_request:
    types: [labeled]

permissions:
  contents: write
  actions: write
  pull-requests: write

env:
  BRANCH: ${{ github.head_ref || github.ref_name }}

jobs:
  screenshots:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'update-baselines'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Must match the image in test.yml, or the new baselines will not match what CI renders.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BRANCH }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright test tests/visual.spec.js --update-snapshots
      - uses: actions/upload-artifact@v4
        with:
          name: baselines
          path: tests/__screenshots__/
          retention-days: 1

  commit:
    needs: screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BRANCH }}
      - uses: actions/download-artifact@v4
        with:
          name: baselines
          path: tests/__screenshots__/
      - name: Commit new baselines
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/__screenshots__
          if git diff --cached --quiet; then
            echo "Baselines already match."
          else
            git commit -m "Update visual baselines"
            git push origin "HEAD:$BRANCH"
          fi
      # A push made by this workflow does not start CI by itself, so start it here.
      - name: Run the site tests on the branch
        run: gh workflow run test.yml --ref "$BRANCH" --repo "$GITHUB_REPOSITORY"

  remove-label:
    needs: [screenshots, commit]
    if: always() && github.event_name == 'pull_request' && github.event.label.name == 'update-baselines'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Take the label off so it can be added again next time
        run: gh pr edit ${{ github.event.pull_request.number }} --remove-label update-baselines --repo "$GITHUB_REPOSITORY"
