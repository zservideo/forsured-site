name: Site tests

on:
  pull_request:
  push:
    branches: [main]
  # Lets anyone re-run the suite on a branch from the Actions tab (for example after
  # the "Update visual baselines" workflow pushes new screenshots, which does not trigger CI by itself).
  workflow_dispatch:

# A new push to a pull request cancels the run for the push before it.
concurrency:
  group: site-tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Playwright's own image has Chromium and its system libraries already installed, so runs
    # skip the browser install (which took 2 to 11 minutes per run) and every run renders
    # screenshots on the same fixed setup. Keep the tag equal to @playwright/test in package.json.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
